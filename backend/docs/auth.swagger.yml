tags:
  - name: Authentication
    description: User authentication and authorization APIs

paths:
  /api/auth/login:
    post:
      summary: Admin/Farmer Login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  example: password123
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
        401:
          description: Invalid credentials

  /api/auth/register/customer:
    post:
      summary: Customer Registration
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: password123
      responses:
        201:
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
        400:
          description: User already exists or invalid input

  /api/auth/login/customer:
    post:
      summary: Customer Login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: password123
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
        401:
          description: Invalid credentials

  /api/auth/register/farmer:
    post:
      summary: Farmer Self-Registration
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Farmer Bob
                email:
                  type: string
                  format: email
                  example: farmerbob@example.com
                password:
                  type: string
                  example: password123
      responses:
        201:
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  role:
                    type: string
        400:
          description: User already exists or invalid input

  /api/auth/dashboard:
    get:
      summary: Farmer Dashboard
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Farmer dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
        401:
          description: Unauthorized - Token required
