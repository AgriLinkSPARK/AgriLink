tags:
  - name: Customer
    description: Customer profile and dashboard management

paths:
  /api/customer/register:
    post:
      summary: Register Customer (legacy customer route)
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: password123
      responses:
        201:
          description: Registration successful
        400:
          description: Invalid input or email already exists

  /api/customer/login:
    post:
      summary: Login Customer (legacy customer route)
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: password123
      responses:
        200:
          description: Login successful
        401:
          description: Invalid credentials
        403:
          description: Use admin/farmer login endpoint

  /api/customer/dashboard:
    get:
      summary: Get Customer Dashboard
      tags: [Customer]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Customer dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                  data:
                    type: object
        401:
          description: Unauthorized

  /api/customer/profile:
    get:
      summary: Get Customer Profile
      tags: [Customer]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Customer profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
        401:
          description: Unauthorized

    put:
      summary: Update Customer Profile
      tags: [Customer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Updated
                email:
                  type: string
                  format: email
                  example: johnupdated@example.com
                password:
                  type: string
                  example: newpassword123
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
        401:
          description: Unauthorized

    delete:
      summary: Delete Customer Profile
      tags: [Customer]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile deleted successfully
        401:
          description: Unauthorized
