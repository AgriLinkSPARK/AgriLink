tags:
  - name: Messages
    description: User messaging and communication APIs

paths:
  /api/messages:
    post:
      summary: Send Message
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - senderId
                - receiverId
                - messageText
              properties:
                senderId:
                  type: string
                  example: 65f1234567890abcdef12345
                receiverId:
                  type: string
                  example: 65f1234567890abcdef67890
                messageText:
                  type: string
                  example: Hello, I'm interested in your products
      responses:
        201:
          description: Message sent successfully
          content:
            application/json:
              schema:
                type: object
        500:
          description: Server error

    get:
      summary: Get Conversation Between Two Users
      tags: [Messages]
      parameters:
        - in: query
          name: senderId
          required: true
          schema:
            type: string
          description: Sender ID
          example: 65f1234567890abcdef12345
        - in: query
          name: receiverId
          required: true
          schema:
            type: string
          description: Receiver ID
          example: 65f1234567890abcdef67890
      responses:
        200:
          description: List of messages in conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    senderId:
                      type: string
                    receiverId:
                      type: string
                    messageText:
                      type: string
                    isEdited:
                      type: boolean
                    createdAt:
                      type: string
                      format: date-time
        500:
          description: Server error

  /api/messages/{id}:
    put:
      summary: Edit Message
      tags: [Messages]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 65f1234567890abcdef12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messageText
              properties:
                messageText:
                  type: string
                  example: Updated message content
      responses:
        200:
          description: Message updated successfully
          content:
            application/json:
              schema:
                type: object
        404:
          description: Message not found
        500:
          description: Server error

    delete:
      summary: Delete Message
      tags: [Messages]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 65f1234567890abcdef12345
      responses:
        200:
          description: Message deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        404:
          description: Message not found
        500:
          description: Server error
