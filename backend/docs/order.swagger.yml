tags:
  - name: Orders
    description: Order management and checkout APIs

paths:
  /api/orders/checkout:
    post:
      summary: Checkout - Create Order from Cart
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        201:
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
                    properties:
                      _id:
                        type: string
                      buyerId:
                        type: string
                      items:
                        type: array
                      totalPrice:
                        type: number
                      status:
                        type: string
        401:
          description: Unauthorized
        500:
          description: Server error

  /api/orders/my-orders:
    get:
      summary: Get Customer's Orders
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                    buyerId:
                      type: string
                    items:
                      type: array
                    totalPrice:
                      type: number
                    status:
                      type: string
        401:
          description: Unauthorized
        500:
          description: Server error

  /api/orders/pay/{id}:
    put:
      summary: Mark Order as Paid
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 65f1234567890abcdef12345
      responses:
        200:
          description: Order marked as paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
        401:
          description: Unauthorized
        404:
          description: Order not found
        500:
          description: Server error

  /api/orders/cancel/{id}:
    put:
      summary: Cancel Order
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 65f1234567890abcdef12345
      responses:
        200:
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    type: object
        401:
          description: Unauthorized
        404:
          description: Order not found
        500:
          description: Server error
