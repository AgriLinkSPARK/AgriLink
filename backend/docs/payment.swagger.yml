tags:
  - name: Payment
    description: Payment processing APIs

paths:
  /api/payment/create-payment-intent/{orderId}:
    post:
      summary: Create or retrieve Stripe PaymentIntent for an order
      tags: [Payment]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          example: 65f1234567890abcdef12345
      responses:
        200:
          description: Client secret and payment intent data
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string
                  paymentIntentId:
                    type: string
                  amount:
                    type: integer
                  currency:
                    type: string
        401:
          description: Unauthorized
        404:
          description: Order not found
        400:
          description: Order already paid or cancelled
        500:
          description: Server error

  /api/payment/status/{orderId}:
    get:
      summary: Get payment status for an order
      tags: [Payment]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          example: 65f1234567890abcdef12345
      responses:
        200:
          description: Payment and order status
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  paymentStatus:
                    type: string
                  orderStatus:
                    type: string
                  stripePaymentIntentId:
                    type: string
                    nullable: true
                  paidAt:
                    type: string
                    format: date-time
                    nullable: true
                  totalPrice:
                    type: number
        401:
          description: Unauthorized
        404:
          description: Order not found
        500:
          description: Server error

  /api/payment/webhook:
    post:
      summary: Stripe webhook endpoint
      tags: [Payment]
      description: Receives Stripe events (raw body required, no bearer token).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Webhook received and processed
        400:
          description: Invalid Stripe signature
        500:
          description: Webhook processing/configuration error
