tags:
  - name: Payment
    description: Payment processing APIs

paths:
  /api/payment/{id}:
    put:
      summary: Pay Order (Simulated)
      tags: [Payment]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 65f1234567890abcdef12345
      responses:
        200:
          description: Payment successful (simulated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Payment successful (simulated)
                  order:
                    type: object
                    properties:
                      _id:
                        type: string
                      paymentStatus:
                        type: string
                        example: Paid
                      status:
                        type: string
                        example: Confirmed
        401:
          description: Unauthorized
        404:
          description: Order not found
        500:
          description: Server error
