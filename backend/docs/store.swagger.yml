tags:
  - name: Store
    description: Farmer store management APIs

paths:
  /api/farmer/store:
    post:
      summary: Create Store
      tags: [Store]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Bob's Farm Store
                description:
                  type: string
                  example: Fresh organic vegetables and fruits
                location:
                  type: string
                  example: 123 Farm Road, City, State
                phone:
                  type: string
                  example: +1234567890
      responses:
        201:
          description: Store created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  name:
                    type: string
                  farmer:
                    type: string
        400:
          description: Store name required or store already exists
        401:
          description: Unauthorized

    get:
      summary: Get My Store
      tags: [Store]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Store details with products
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  location:
                    type: string
                  phone:
                    type: string
                  farmer:
                    type: string
                  products:
                    type: array
                    items:
                      type: object
        404:
          description: Store not found
        401:
          description: Unauthorized
